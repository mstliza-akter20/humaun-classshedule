<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSTU CSE Academic Portal</title><style>
:root{--navy:#12233f;--blue:#2456a6;--sky:#eaf2ff;--ink:#1e293b;--muted:#64748b;--line:#dce4ef;--paper:#fff;--bg:#f4f7fb;--green:#0f766e;--orange:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}header{background:var(--navy);color:#fff;padding:16px clamp(14px,4vw,52px);box-shadow:0 4px 18px #14284a24}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900}.brand b{display:block;font-size:18px}.brand small{display:block;color:#c6d4eb;margin-top:4px}nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:650}nav button{color:#e7efff;background:transparent}nav button:hover,nav button.active{background:#2b4772;color:#fff}main{max-width:1450px;margin:auto;padding:28px clamp(12px,3vw,36px);min-height:70vh}footer{text-align:center;color:var(--muted);padding:22px;font-size:13px}.hero{background:linear-gradient(120deg,#132b50,#2862ac);color:white;border-radius:20px;padding:clamp(24px,5vw,48px);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.hero h1{font-size:clamp(28px,4vw,42px);margin:0 0 12px}.hero p{max-width:650px;line-height:1.65;color:#dce9ff;margin:0}.hero .tag{border:1px solid #b7d2ff;border-radius:100px;padding:10px 15px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:20px 0}.stat,.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 4px 14px #13284a08}.stat small,.muted{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:7px;color:var(--blue)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:28px 0 14px}.section-head h1,.section-head h2{margin:0}.section-head p{color:var(--muted);margin:7px 0 0}.filters,.form-grid{display:flex;gap:10px;flex-wrap:wrap;align-items:end}input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:10px 11px;background:#fff;min-width:150px;color:var(--ink)}textarea{width:100%;min-height:90px}.field{display:grid;gap:6px;flex:1;min-width:150px}.field label{font-size:13px;font-weight:700;color:#475569}.primary{background:var(--blue);color:white}.secondary{background:#e8eef7;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}.success{background:#dff7ee;color:#065f46}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:white}table{border-collapse:separate;border-spacing:0;width:100%;min-width:940px}th,td{padding:12px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;text-align:left;font-size:13px}th{background:#edf3fc;color:#17365f;font-weight:800;white-space:nowrap}tr:last-child td{border-bottom:0}td:last-child,th:last-child{border-right:0}.routine-table th:first-child{position:sticky;left:0;z-index:2}.routine-table td:first-child{font-weight:800;background:#f7f9fd;position:sticky;left:0;z-index:1;white-space:nowrap}.slot{min-width:118px;min-height:68px;background:#eef5ff;border-left:3px solid #4778c4;border-radius:6px;padding:8px;line-height:1.5}.slot b{display:block;color:#173b70}.slot small{color:#52647d}.empty{color:#a0aaba;text-align:center;padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card h3{margin:0 0 8px}.pill{display:inline-block;border-radius:100px;padding:4px 9px;background:#e9f1ff;color:#2456a6;font-size:12px;font-weight:750}.pill.green{background:#dcfce7;color:#166534}.list{display:grid;gap:10px}.rowitem{display:flex;justify-content:space-between;align-items:start;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.rowitem:last-child{border-bottom:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.admin-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}.admin-tabs{display:grid;align-content:start;gap:7px}.admin-tabs button{text-align:left;background:white;border:1px solid var(--line)}.admin-tabs button.active{background:var(--navy);color:white}.form-panel{display:grid;gap:16px}.form-grid>*{flex:1;min-width:180px}.notice{border-left:4px solid var(--blue)}.warning{padding:12px 14px;background:#fff7e6;color:#8a4b08;border-radius:10px;line-height:1.5}.hidden{display:none!important}.room-card{cursor:pointer;transition:transform .15s,border-color .15s}.room-card:hover{transform:translateY(-2px);border-color:var(--blue)}.map-frame{width:100%;height:430px;border:0;border-radius:14px}.room-detail{margin-top:18px}.map-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.room-map{background:linear-gradient(145deg,#f8fbff,#eaf1fa);border:1px solid #d4dfed;border-radius:18px;padding:18px;overflow:hidden}.room-map-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.room-map-title h3{margin:0}.room-map-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:570px;margin:0 auto}.map-room{min-height:66px;border:1px solid #c5d5e8;background:#fff;color:var(--navy);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 13px;box-shadow:0 3px 9px #18365b0b;transition:.15s}.map-room strong{font-size:19px}.map-room small{font-size:11px;color:var(--muted);display:block}.map-room:hover,.map-room.selected{border-color:#2456a6;background:#dceaff;box-shadow:0 0 0 2px #2456a622}.map-room.selected{outline:2px solid #2456a6}.map-offices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:14px}.map-office{padding:11px 8px;background:#e5f4ed;color:#14543d;border:1px solid #b9e1cf;border-radius:10px;text-align:center;font-size:12px;font-weight:750}.map-gate{margin-top:14px;text-align:center;padding:14px;background:#17365f;color:#fff;border-radius:12px;font-weight:800;letter-spacing:.04em}.map-gate small{display:block;font-weight:500;opacity:.8;margin-top:4px}.map-key{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}.room-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.room-picker button{background:#edf3fc;color:#17365f}.room-picker button.active{background:#2456a6;color:#fff}@media(max-width:760px){.map-layout{grid-template-columns:1fr}}dialog{border:0;border-radius:16px;padding:24px;max-width:420px;width:calc(100% - 30px);box-shadow:0 25px 80px #10213b55}dialog::backdrop{background:#0b1730a8}dialog form{display:grid;gap:13px}dialog h2{margin:0}dialog p,dialog small{color:var(--muted);line-height:1.5}@media(max-width:760px){.admin-grid{grid-template-columns:1fr}.admin-tabs{display:flex;overflow:auto}.admin-tabs button{white-space:nowrap}.brand b{font-size:15px}main{padding-top:18px}.routine-table th:first-child,.routine-table td:first-child{position:static}}

</style></head><body><header><div class="brand"><div class="logo">CSE</div><div><b>JSTU · Department of CSE</b><small>Academic Portal & Class Routine</small></div></div><nav id="nav"><button data-page="home" class="active">Home</button><button data-page="routine">Class Routine</button><button data-page="courses">Courses</button><button data-page="teachers">Teachers</button><button data-page="rooms">Classrooms</button><button data-page="campusmap">Campus Map</button><button data-page="notices">Notices</button><button data-page="admin">Admin Panel</button></nav></header><main id="app"></main><footer>JSTU Department of Computer Science & Engineering · Academic Portal</footer><dialog id="loginDialog"><form method="dialog" id="loginForm"><h2>Admin login</h2><p>Enter the admin password to manage portal data.</p><input id="adminPassword" type="password" placeholder="Admin password" required><div class="actions"><button value="cancel" class="secondary">Cancel</button><button value="login" class="primary">Login</button></div><small>Demo password: <b>admin123</b>. Change this before publishing.</small></form></dialog><script>
'use strict';
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday'];
const TIMES=['09:00–10:00 AM','10:00–11:00 AM','11:00 AM–12:00 PM','12:00–01:00 PM','01:15–02:15 PM','02:15–03:15 PM','03:15–04:15 PM'];
const initial={batches:[{id:1,name:'1st Year (Session 2025-2026)',semester:'1st Semester'}],courses:[
{ id:1,code:'CSE 1111',name:'Computer Fundamental & Professional Ethics',credit:'3'},{id:2,code:'CSE 1112',name:'Computer Fundamental Sessional',credit:'1.5'},{id:3,code:'CSE 1121',name:'Structure Programming',credit:'3'},{id:4,code:'CSE 1122',name:'Structure Programming Sessional',credit:'1.5'},{id:5,code:'CSE 1131',name:'Basic Electrical Engineering',credit:'3'},{id:6,code:'CSE 1132',name:'Basic Electrical Engineering Sessional',credit:'1'},{id:7,code:'PHY 1111',name:'Physics',credit:'3'},{id:8,code:'MAT 1111',name:'Calculus and Coordinate Geometry',credit:'3'}],teachers:[
{id:1,name:'Mohammad Hasan',category:'Department',subject:'CSE',designation:'Teacher'},{id:2,name:'Sujit Roy',category:'Department',subject:'CSE',designation:'Teacher'},{id:3,name:'Dr. Mahmudul Alam',category:'Department',subject:'CSE',designation:'Teacher'},{id:4,name:'Md. Humaun Kabir',category:'Department',subject:'CSE',designation:'Teacher'},{id:5,name:'Sydur Rahman',category:'Department',subject:'CSE',designation:'Teacher'},{id:6,name:'Md. Khabir Uddin Ahmed',category:'Department',subject:'CSE',designation:'Teacher'},{id:7,name:'Md. Mahfuzul Haque',category:'Non-department',subject:'EEE',designation:'Teacher'},{id:8,name:'Suraiya Sultana',category:'Non-department',subject:'Physics',designation:'Teacher'},{id:9,name:'Md. Nazmul Hossain',category:'Non-department',subject:'Mathematics',designation:'Teacher'}],rooms:Array.from({length:10},(_,i)=>({id:i+1,number:String(i+108),type:'Classroom'})),notices:[],routine:[]};
// Routine data copied in the same day/time order as the provided image.
const schedule=[
['Sunday',1,'CSE 1111','MSR','L3'],['Sunday',2,'CSE 1111','MSR','L3'],['Sunday',3,'MAT 1111','MNH','L5'],['Sunday',4,'CSE 1121','MH','L3'],['Sunday',5,'CSE 1121','MH','L3'],
['Monday',1,'CSE 1112','SR','L3'],['Monday',2,'CSE 1112','SR','L3'],['Monday',3,'CSE 1112','SR','L3'],['Monday',4,'CSE 1131','MMH','L3'],
['Tuesday',2,'CSE 1131','MMH','L3'],['Tuesday',3,'PHY 1111','SS','L3'],['Tuesday',4,'MAT 1111','MNH','L3'],['Tuesday',5,'MAT 1111','MNH','L3'],
['Wednesday',1,'PHY 1111','SS','L3'],['Wednesday',2,'PHY 1111','SS','L3'],['Wednesday',3,'CSE 1131','MMH','EL2'],['Wednesday',4,'CSE 1132','MMH','EL2'],['Wednesday',5,'CSE 1132','MMH','EL2'],
['Thursday',1,'CSE 1121','MH','L1'],['Thursday',2,'CSE 1122','MH','L1'],['Thursday',3,'CSE 1122','MH','L1'],['Thursday',4,'CSE 1122','MH','L1'],['Thursday',5,'CSE 1111','MSR','L1']];
const teacherByCode={MSR:'Sydur Rahman',SR:'Sujit Roy',MH:'Mohammad Hasan',MMH:'Md. Mahfuzul Haque',SS:'Suraiya Sultana',MNH:'Md. Nazmul Hossain'};
initial.routine=schedule.map((x,i)=>({id:i+1,batch:initial.batches[0].name,semester:'1st Semester',day:x[0],timeIndex:x[1],course:x[2],teacher:teacherByCode[x[3]],teacherCode:x[3],room:x[4],type:'Class'}));
const KEY='jstu_cse_portal_v4';let data;try{data=JSON.parse(localStorage.getItem(KEY))||JSON.parse(JSON.stringify(initial))}catch{data=JSON.parse(JSON.stringify(initial))};let page='home',adminTab='routine',isAdmin=false,editId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nextId(arr){return Math.max(0,...arr.map(x=>Number(x.id)||0))+1}function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.page==='admin'&&!isAdmin){document.querySelector('#loginDialog').showModal();return}go(b.dataset.page)});document.querySelector('#loginForm').addEventListener('submit',e=>{if(e.submitter?.value==='login'){if(document.querySelector('#adminPassword').value==='admin123'){isAdmin=true;document.querySelector('#loginDialog').close();go('admin')}else{e.preventDefault();alert('Incorrect password')}}});
function head(title,desc,actions=''){return `<div class="section-head"><div><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`}function btn(label,fn,cls='primary'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function home(){return `<section class="hero"><div><h1>Academic Portal</h1><p>JSTU Department of Computer Science & Engineering. Find the official class routine, courses, teachers and classroom list in one place.</p></div><span class="tag">Routine effective: 13 July 2026</span></section><div class="stats"><div class="stat"><small>Class days</small><strong>5</strong></div><div class="stat"><small>Courses in routine</small><strong>${data.courses.length}</strong></div><div class="stat"><small>Classrooms</small><strong>${data.rooms.length}</strong></div><div class="stat"><small>Routine slots</small><strong>${data.routine.length}</strong></div></div>${head('Quick access','Choose a section to view the latest portal information.')}<div class="cards"><div class="card"><h3>Class Routine</h3><p class="muted">Weekly schedule in the same day/time sequence as the provided picture.</p>${btn('View routine',"go('routine')")}</div><div class="card"><h3>Courses</h3><p class="muted">Course codes, titles and credits.</p>${btn('View courses',"go('courses')")}</div><div class="card"><h3>Teachers</h3><p class="muted">Department and non-department teachers in separate groups.</p>${btn('View teachers',"go('teachers')")}</div><div class="card"><h3>Classrooms</h3><p class="muted">Rooms 109 through 117.</p>${btn('View rooms',"go('rooms')")}</div></div><p class="warning" style="margin-top:18px">Admin demo: click Admin Panel and sign in with <b>admin123</b>. This local-only demo is not secure enough for public deployment; use a server login and database before publishing.</p>`}
function routine(){const batches=[...new Set(data.routine.map(x=>x.batch))];return `${head('Class Routine','Weekly timetable · rows are weekdays, columns follow the picture’s time order.')}<div class="panel"><div class="filters"><div class="field"><label>Batch</label><select id="routineBatch" onchange="renderRoutineOnly()">${batches.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Semester</label><select id="routineSemester" onchange="renderRoutineOnly()">${[...new Set(data.routine.map(x=>x.semester))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div><div id="routineTable" style="margin-top:16px"></div></div>`}
function renderRoutineOnly(){const b=document.querySelector('#routineBatch')?.value,s=document.querySelector('#routineSemester')?.value;const rows=data.routine.filter(x=>(!b||x.batch===b)&&(!s||x.semester===s));const html=`<div class="table-wrap"><table class="routine-table"><thead><tr><th>Day / Time</th>${TIMES.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${DAYS.map(day=>`<tr><td>${day}</td>${TIMES.map((t,ti)=>{const x=rows.find(a=>a.day===day&&Number(a.timeIndex)===ti);return `<td>${x?`<div class="slot"><b>${esc(x.course)}</b>${esc(x.teacherCode||x.teacher)}<br><small>${esc(x.room)}${roomNum(x.room)?' · Room '+roomNum(x.room):''}</small></div>`:'<div class="empty">—</div>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;document.querySelector('#routineTable').innerHTML=html}
function roomNum(code){return ({L1:'108',L2:'109',L3:'112',R1:'115',L4:'116',L5:'117',EL1:'110',EL2:'111',EL3:'113'})[code]||''}
function courses(){return `${head('Courses','Only courses listed in the provided first-year routine.')}<div class="cards">${data.courses.map(c=>`<article class="card"><span class="pill">${esc(c.code)}</span><h3 style="margin-top:12px">${esc(c.name)}</h3><p class="muted">Credit: ${esc(c.credit)}</p></article>`).join('')}</div>`}
function teachers(){const groups=[['Department Teachers','Department'],['Non-Department Teachers','Non-department']];return `${head('Teachers','Department and supporting-subject teachers are shown separately.')}<div class="list">${groups.map(([title,cat])=>`<section class="panel"><h2>${title}</h2><div class="cards">${data.teachers.filter(t=>t.category===cat).map(t=>`<article class="card"><h3>${esc(t.name)}</h3><span class="pill ${cat==='Department'?'':'green'}">${esc(t.subject||cat)}</span><p class="muted">${esc(t.designation||'Teacher')}</p></article>`).join('')||'<p class="muted">No teachers added.</p>'}</div></section>`).join('')}</div>`}
function rooms(){const all=[...new Set([...Array.from({length:10},(_,i)=>String(i+108)),...(data.rooms||[]).map(r=>String(r.number))])].sort((a,b)=>Number(a)-Number(b));return `${head('Classrooms & Room Finder','Room number select করো—map-এ room highlight হবে, নিচে class routine ও location guide দেখাবে।')}<div class="panel notice"><h3>কীভাবে রুম খুঁজবে</h3><p>তোমার দেওয়া room-location sketch অনুযায়ী Academic Building gate নিচের দিকে, অফিসগুলো তার উপরে এবং room 108–117 দুই পাশে সাজানো হয়েছে। এটি sketch-based guide; official measured floor plan নয়।</p></div><section class="room-map" style="margin-top:16px"><div class="room-map-title"><div><h3>Academic Building · Room Map</h3><p class="muted" style="margin:5px 0 0">Select any room number</p></div><span class="pill">10 Rooms · 108–117</span></div><div class="room-map-grid">${[117,116,115,114,113,112,111,110,109,108].map((n,i)=>`<button type="button" class="map-room" data-room="${n}" onclick="selectCampusRoom('${n}')"><span><strong>${n}</strong><small>${[112,111,108].includes(n)?'Room / Lab':'Room'}</small></span><span>↗</span></button>`).join('')}</div><div class="map-offices"><div class="map-office">GEOLOGY OFFICE</div><div class="map-office">SW OFFICE</div><div class="map-office">EEE OFFICE</div><div class="map-office">CSE OFFICE</div><div class="map-office" style="grid-column:1/-1">COMMON ROOM (W)</div></div><div class="map-gate">↓ ACADEMIC BUILDING GATE <small>Campus entrance · sketch reference</small></div><div class="map-key">Map layout follows the uploaded ROOM LOCATION sketch. Exact scale, floor level, and walking route have not been independently verified.</div></section><div class="section-head"><div><h2>All Room Numbers</h2><p>Click a room to see its routine and details.</p></div></div><div class="room-picker">${all.map(n=>`<button type="button" onclick="selectCampusRoom('${n}')">Room ${n}</button>`).join('')}</div><div id="roomDetail" class="panel room-detail hidden"></div>`}
function selectCampusRoom(number){document.querySelectorAll('.map-room').forEach(el=>el.classList.toggle('selected',el.dataset.room===String(number)));document.querySelectorAll('.room-picker button').forEach(el=>el.classList.toggle('active',el.textContent.trim()==='Room '+String(number)));showRoom(number)}
function showRoom(number){const codes=Object.entries({L1:'108',L2:'109',EL1:'110',EL2:'111',L3:'112',EL3:'113',R1:'115',L4:'116',L5:'117'}).filter(([code,n])=>n===String(number)).map(([code])=>code);const entries=data.routine.filter(x=>String(roomNum(x.room))===String(number)||codes.includes(x.room));const box=document.querySelector('#roomDetail');if(!box)return;box.classList.remove('hidden');box.innerHTML=`<div class="section-head"><div><h2>Room ${esc(number)} — Class details</h2><p>Academic Building · West-side room sequence (user-provided directions)</p></div><button class="secondary" onclick="document.querySelector('#roomDetail').classList.add('hidden')">Close</button></div><div class="warning">Route: Academic Building gate দিয়ে ঢুকে ডান দিকে যাও, তারপর West side-এর room serial অনুসরণ করো। Floor/precise pin official plan দিয়ে verify করা হয়নি।</div><h3 style="margin-top:18px">Scheduled classes</h3>${entries.length?`<div class="table-wrap"><table><thead><tr><th>Day</th><th>Time</th><th>Course</th><th>Teacher</th><th>Room code</th></tr></thead><tbody>${entries.map(x=>`<tr><td>${esc(x.day)}</td><td>${esc(TIMES[x.timeIndex]||'')}</td><td>${esc(x.course)}</td><td>${esc(x.teacher)}</td><td>${esc(x.room)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">এই রুমের জন্য routine-এ কোনো class entry নেই। Admin Panel → Routine থেকে যোগ করতে পারবে।'}</p>`;box.scrollIntoView({behavior:'smooth',block:'start'})}
function campusmap(){const places=[{name:'Academic Building',type:'Academic',desc:'Classrooms and the room-number guide based on your uploaded sketch.',query:'Academic Building Jamalpur Science and Technology University'},{name:'Administrative Building',type:'Administration',desc:'Administrative offices; university medical center is listed at this building.',query:'Administrative Building Jamalpur Science and Technology University'},{name:'Medical Center',type:'Health service',desc:'University medical center; confirm the route with campus staff.',query:'Medical Center Jamalpur Science and Technology University'},{name:'Central Library',type:'Study',desc:'Search this facility on Google Maps.',query:'Central Library Jamalpur Science and Technology University'},{name:'Student Halls',type:'Accommodation',desc:'Search university student halls on Google Maps.',query:'Student Hall Jamalpur Science and Technology University'},{name:'Central Field',type:'Sports',desc:'Search the campus sports field.',query:'Central Field Jamalpur Science and Technology University'},{name:'Central Cafeteria',type:'Food',desc:'Search the campus cafeteria.',query:'Cafeteria Jamalpur Science and Technology University'},{name:'University Main Gate',type:'Campus entrance',desc:'Open the university location and directions.',query:'Jamalpur Science and Technology University main gate'}];const nums=Array.from({length:10},(_,i)=>String(i+108));return `${head('University Locations','Campus map, building search and clickable classroom numbers')}<section class="panel notice"><h2>Find your destination</h2><p>Campus-wide locations open Google Maps search. Room 108–117 opens the interactive Academic Building room guide based on the sketch you uploaded.</p></section><div class="map-layout" style="margin-top:16px"><section class="panel"><h2>JSTU Campus Map</h2><p class="muted">Melandaha, Jamalpur, Bangladesh</p><iframe class="map-frame" title="JSTU campus map" loading="lazy" src="https://maps.google.com/maps?q=Jamalpur%20Science%20and%20Technology%20University%2C%20Melandaha%2C%20Jamalpur&t=&z=15&ie=UTF8&iwloc=&output=embed"></iframe><div class="actions"><a href="https://www.google.com/maps/search/?api=1&query=Jamalpur+Science+and+Technology+University" target="_blank" rel="noopener"><button class="primary">Open Campus in Google Maps ↗</button></a></div><h3 style="margin-top:20px">Academic Building Room Map</h3><p class="muted">Choose a room number to highlight it and view its routine.</p><div class="room-picker">${nums.map(n=>`<button type="button" onclick="go('rooms');setTimeout(()=>selectCampusRoom('${n}'),0)">Room ${n}</button>`).join('')}</div></section><section class="panel"><h2>Buildings & Facilities</h2><div class="field"><label for="placeSearch">Search a building / facility</label><input id="placeSearch" placeholder="e.g. Medical Center" oninput="filterCampusPlaces(this.value)"></div><div id="campusPlaceList" class="cards" style="grid-template-columns:1fr;margin-top:14px">${places.map(p=>`<article class="card campus-place" data-search="${esc((p.name+' '+p.type+' '+p.desc).toLowerCase())}"><span class="pill">${esc(p.type)}</span><h3 style="margin-top:9px">${esc(p.name)}</h3><p class="muted">${esc(p.desc)}</p><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.query)}" target="_blank" rel="noopener"><button class="primary">Find on Google Maps ↗</button></a>${p.name==='Academic Building'?`<div class="actions"><button class="secondary" onclick="go('rooms')">Open room-number map</button></div>`:''}</article>`).join('')}</div></section></div><p class="muted" style="margin-top:14px">Note: the uploaded sketch is used for the Academic Building room arrangement. Google Maps may not provide exact indoor room pins, and building pins should be confirmed locally.</p><p><a href="https://jstu.ac.bd/index.php/office/medical.php" target="_blank" rel="noopener">Official Medical Center information</a> · <a href="https://www.google.com/maps/search/?api=1&query=Jamalpur+Science+and+Technology+University" target="_blank" rel="noopener">Google Maps</a></p>`}function filterCampusPlaces(value){const q=String(value||'').toLowerCase();document.querySelectorAll('.campus-place').forEach(el=>el.style.display=el.dataset.search.includes(q)?'':'none')}
function notices(){return `${head('Notices','Announcements managed from the admin panel.')}<div class="list">${data.notices.map(n=>`<article class="card notice"><span class="pill">${esc(n.date||'Notice')}</span><h3 style="margin-top:10px">${esc(n.title)}</h3><p>${esc(n.description)}</p></article>`).join('')||'<div class="panel muted">There are no notices yet.</div>'}</div>`}
const configs={routine:{title:'Routine entries',arr:'routine',fields:[['batch','Batch','selectBatch'],['semester','Semester','selectSemester'],['day','Day','selectDay'],['timeIndex','Time slot','selectTime'],['course','Course code','selectCourse'],['teacher','Teacher name','text'],['teacherCode','Teacher initials','text'],['room','Room / room code','text'],['type','Class type','text']]},courses:{title:'Courses',arr:'courses',fields:[['code','Course code','text'],['name','Course title','text'],['credit','Credits','text']]},teachers:{title:'Teachers',arr:'teachers',fields:[['name','Teacher name','text'],['category','Category','selectCategory'],['subject','Department / subject','text'],['designation','Designation','text']]},rooms:{title:'Classrooms',arr:'rooms',fields:[['number','Room number','text'],['type','Room type','text']]},notices:{title:'Notices',arr:'notices',fields:[['title','Notice title','text'],['date','Date','date'],['description','Description','textarea']]},batches:{title:'Batches / semesters',arr:'batches',fields:[['name','Batch name','text'],['semester','Semester','text']]}};
function admin(){return `${head('Admin Panel','Add, edit or remove the portal data. Changes are saved in this browser.')}<div class="warning">This version stores data in this browser’s localStorage. It does not automatically sync to other computers or users. Do not publish the demo password as real security.</div><div class="admin-grid" style="margin-top:16px"><aside class="admin-tabs">${[['routine','Routine'],['courses','Courses'],['teachers','Teachers'],['rooms','Classrooms'],['notices','Notices'],['batches','Batches']].map(([id,l])=>`<button class="${adminTab===id?'active':''}" onclick="adminTab='${id}';editId=null;render()">${l}</button>`).join('')}<button onclick="exportData()">Export backup JSON</button><button onclick="document.querySelector('#importFile').click()">Import backup JSON</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></aside><section class="panel form-panel" id="adminEditor">${adminEditor()}</section></div>`}
function fieldInput(f,v=''){let [key,label,type]=f;let opts='';if(type==='selectBatch')opts=data.batches.map(x=>`<option ${x.name===v?'selected':''}>${esc(x.name)}</option>`).join('');if(type==='selectSemester')opts=[...new Set(['1st Semester',...data.routine.map(x=>x.semester)])].map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');if(type==='selectDay')opts=DAYS.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');if(type==='selectTime')opts=TIMES.map((x,i)=>`<option value="${i}" ${Number(v)===i?'selected':''}>${x}</option>`).join('');if(type==='selectCourse')opts=data.courses.map(x=>`<option ${x.code===v?'selected':''}>${esc(x.code)}</option>`).join('');if(type==='selectCategory')opts=['Department','Non-department'].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');let input=type.startsWith('select')?`<select name="${key}" ${key==='timeIndex'?'':'required'}>${opts}</select>`:type==='textarea'?`<textarea name="${key}" required>${esc(v)}</textarea>`:`<input name="${key}" type="${type==='date'?'date':'text'}" value="${esc(v)}" ${key==='credit'?'':'required'}>`;return `<div class="field"><label>${label}</label>${input}</div>`}
function adminEditor(){const c=configs[adminTab],arr=data[c.arr],item=arr.find(x=>String(x.id)===String(editId))||{};return `<div><h2>${c.title}</h2><p class="muted">${arr.length} records · ${editId?'Editing selected record':'Create a new record'}</p></div><form id="recordForm" onsubmit="saveRecord(event)"><div class="form-grid">${c.fields.map(f=>fieldInput(f,item[f[0]]??(f[0]==='timeIndex'?0:f[0]==='day'?'Sunday':f[0]==='category'?'Department':f[0]==='semester'?'1st Semester':''))).join('')}</div><div class="actions"><button class="primary" type="submit">${editId?'Save changes':'Add record'}</button>${editId?'<button type="button" class="secondary" onclick="editId=null;render()">Cancel edit</button>':''}</div></form><hr style="border:0;border-top:1px solid var(--line);width:100%"><h3>Existing ${c.title.toLowerCase()}</h3><div class="list">${arr.map(x=>`<div class="rowitem"><div><b>${esc(summary(adminTab,x))}</b><div class="muted">${esc(subsummary(adminTab,x))}</div></div><div class="actions" style="margin:0"><button class="secondary" onclick="editRecord(${x.id})">Edit</button><button class="danger" onclick="deleteRecord(${x.id})">Delete</button></div></div>`).join('')||'<p class="muted">No records yet.</p>'}</div>`}
function summary(tab,x){return tab==='routine'?`${x.day} · ${TIMES[x.timeIndex]||''} · ${x.course}`:tab==='courses'?`${x.code} · ${x.name}`:tab==='teachers'?x.name:tab==='rooms'?`Room ${x.number}`:tab==='notices'?x.title:x.name}function subsummary(tab,x){return tab==='routine'?`${x.batch} · ${x.teacher} · ${x.room}`:tab==='courses'?`Credits: ${x.credit}`:tab==='teachers'?`${x.category} · ${x.subject||''}`:tab==='rooms'?x.type||'Classroom':tab==='notices'?`${x.date||''} · ${x.description}`:x.semester||''}
function saveRecord(e){e.preventDefault();const c=configs[adminTab],fd=new FormData(e.target),obj={};for(const f of c.fields){let v=fd.get(f[0]);obj[f[0]]=f[2]==='selectTime'?Number(v):String(v??'').trim()}if(adminTab==='routine'&&!data.batches.some(b=>b.name===obj.batch)){if(!confirm('This batch does not exist in Batches. Add it anyway?'))return}if(editId){const i=data[c.arr].findIndex(x=>String(x.id)===String(editId));data[c.arr][i]={...data[c.arr][i],...obj}}else data[c.arr].push({id:nextId(data[c.arr]),...obj});editId=null;save();render()}
function editRecord(id){editId=id;render()}function deleteRecord(id){if(!confirm('Delete this record?'))return;data[configs[adminTab].arr]=data[configs[adminTab].arr].filter(x=>String(x.id)!==String(id));editId=null;save();render()}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jstu-cse-portal-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);for(const k of Object.keys(configs))if(!Array.isArray(d[k]))throw Error('Invalid backup');if(!confirm('Replace current browser data with this backup?'))return;data={...initial,...d};save();render()}catch(err){alert('Could not import: '+err.message)}};r.readAsText(f)}
function render(){const views={home,routine,courses,teachers,rooms,campusmap,notices,admin};document.querySelector('#app').innerHTML=(views[page]||home)();if(page==='routine')renderRoutineOnly()}
// Expose handlers explicitly so buttons work reliably when opened as a local HTML file.
Object.assign(window,{go,render,renderRoutineOnly,editRecord,deleteRecord,saveRecord,exportData,importData,showRoom,selectCampusRoom});
render();

</script></body></html>
